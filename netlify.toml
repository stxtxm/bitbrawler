[build]
  # vite build only, not `npm run build`. The repo's `build` script is
  # `tsc && vite build`, and CI already runs `npx tsc --noEmit` on every PR and
  # blocks the merge when it fails — so master is always type-clean. Paying for
  # a second type-check on every deploy is wasted build minutes.
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # No `included` / `included_environment_variables` allowlist here on purpose:
  # Netlify exposes every site env var to functions by default, and both of
  # those keys expect an object (external_node_modules) in this CLI version,
  # which turns into a config parse error. The 500 was never about variable
  # visibility — the variables simply did not exist on the site.

# BrowserRouter needs an SPA fallback. force = false (the default) makes this a
# shadowing redirect: it only applies when nothing else matches, so the
# /api/idle-processor function keeps priority. A forced catch-all would be
# evaluated first and would swallow the API, silently killing idle processing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
