name: Global Daily Reset

on:
  schedule:
    # Two schedules to cover Europe/Paris midnight across DST.
    - cron: '0 22 * * *' # 00:00 Paris during CEST (UTC+2)
    - cron: '0 23 * * *' # 00:00 Paris during CET (UTC+1)
  workflow_dispatch:

jobs:
  daily-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Global Daily Reset
        id: daily-reset
        continue-on-error: true
        run: npm run daily-reset:run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Send Lootbox Push Notifications
        if: always()
        continue-on-error: true
        run: npm run push-notify:run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

      - name: Sanity Check
        if: always()
        run: |
          if [ "${{ steps.daily-reset.outcome }}" = "failure" ]; then
            echo "❌ Daily reset step failed. Characters may not have been reset."
            echo "ℹ️ Check Supabase maintenance table for partial completion status."
            exit 0
          fi
          echo "✅ Daily reset step completed successfully"
