name: Tech Lead Daily

on:
  schedule:
    # Run at 21h Paris time (= 19h UTC standard, 21h UTC+2)
    # Use 19h UTC to cover both standard and summer time
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: tech-lead-analysis-lane
  cancel-in-progress: false

jobs:
  tech-lead:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "opencode-agent"
          git config user.email "agent@opencode.ai"

      - name: Fetch existing open issues (for duplicate detection)
        id: existing-issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --limit 100 --json number,title,labels,updatedAt,body \
            --jq '.[] | {number, title, labels: [.labels[].name], updatedAt, body: (.body // "" | .[0:300])}' > /tmp/existing-issues.json 2>/dev/null || echo "[]" > /tmp/existing-issues.json
          echo "EXISTING_ISSUES=$(cat /tmp/existing-issues.json | wc -l) open issues found"
          echo "issue_count=$(cat /tmp/existing-issues.json | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Mark issue scan start
        run: echo "TECH_LEAD_SCAN_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Analyze QA Stats
        run: |
          if [ -f qa/stats.json ]; then
            echo "📊 Found qa/stats.json, analyzing..."
            npx tsx scripts/analyze-qa-stats.ts
            echo "QA_ANALYSIS_DONE=true" >> "$GITHUB_ENV"
          else
            echo "⚠ No qa/stats.json found, skipping analysis"
            echo "QA_ANALYSIS_DONE=false" >> "$GITHUB_ENV"
          fi

      - name: Run Tech Lead agent
        env:
          # Les modeles opencode/*-free ne demandent AUCUN credential : `opencode auth list`
          # ne liste aucun provider `opencode`, et un run anonyme aboutit. Exporter une cle
          # EXPIREE fait au contraire repondre au provider "This API key has expired" et tue
          # les 3 modeles de la chaine en 3 secondes chacun.
          GH_TOKEN: ${{ github.token }}
          # Repli hors quota (incident 2026-11-01 → 04) : les slugs *-free partagent
          # un quota PAR IP ET PAR JOUR UTC. Les runners GitHub partagent leurs IP,
          # donc le bucket est deja vide : les 3 modeles repondent
          # "Free usage limit reached". Z.AI GLM-4.5-Flash via broker OIDC Cloudflare
          # (pas de Google, pas de secret GitHub). Indisponible => repli saute.
        run: |
          MODELS=(
            "opencode/deepseek-v4.1-flash-free"
            "opencode/glm-5.3-flash-free"
            "opencode/nemotron-3.5-lightning-free"
          )
          # Le quota est partage par les trois slugs : inutile d'attendre que le
          # CLI retente pendant 2 min, le watchdog coupe et on passe au bearer
          # d'un vrai quota.
          # OIDC broker (Cloudflare /api/agent-key) — pas de secret GitHub.
          # Repli Z.AI GLM-4.5-Flash (gratuit, tool-calling) : quota distinct
          # du bucket opencode/*-free partagé par IP/jour UTC.
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            OIDC_TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=bitbrawler-agents" 2>/dev/null | jq -r '.value // empty' 2>/dev/null || true)
            if [ -n "$OIDC_TOKEN" ]; then
              ZAI_API_KEY=$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" \
                "https://bitbrawler.pages.dev/api/agent-key?provider=zai" 2>/dev/null | jq -r '.key // empty' 2>/dev/null || true)
            fi
          fi
          if [ -n "${ZAI_API_KEY:-}" ]; then
            export ZAI_API_KEY
            MODELS+=("zai/glm-4.5-flash")
          else
            echo "::warning::Broker Z.AI/GLM indisponible (clé Cloudflare absente ou OIDC refusé) — aucun repli hors quota gratuit."
          fi

          # Read latest QA analysis if available
          QA_REPORT=""
          if [ -f qa/analysis-latest.json ]; then
            QA_REPORT=$(cat qa/analysis-latest.json)
          fi

          EXISTING_ISSUES_JSON=$(cat /tmp/existing-issues.json 2>/dev/null || echo "[]")

          PROMPT="Tu es le tech-lead de Bitbrawler. Analyse le repo aujourd'hui en profondeur.

            ⚠️ RÈGLE OBLIGATOIRE : VÉRIFIE LES ISSUES EXISTANTES AVANT D'EN CRÉER

            Tu DOIS toujours commencer par lister les issues ouvertes existantes avec:
            gh issue list --state open --limit 50 --json number,title,labels

            Si une issue similaire existe DÉJÀ :
            - **Ne crée PAS** une nouvelle issue
            - **Commente** l'issue existante avec les nouvelles données QA
            - Si le bug est résolu dans les commits récents → ferme l'issue

            Issues ouvertes existantes:
            \`\`\`json
            ${EXISTING_ISSUES_JSON}
            \`\`\`

            ## 1. QA Stats Analysis (données de jeu réelles)
            \`\`\`json
            ${QA_REPORT:-"Pas de données QA disponibles."}
            \`\`\`

            À partir du rapport QA :
            - **PvE Analysis**: win rate PvE, monstres rencontrés, durée des combats
            - **Equipment**: objets portés, diversité
            - **Streak**: progression streak journalière
            - **HP Growth**: +5-30 HP/run est sain. Trop bas ou trop haut ?
            - **Lootbox Rarités**: si rares/epic manquent, ajuste LOOTBOX_RARITY_WEIGHTS
            - **Trends**: win rate last_3 vs last_5 vs all_time. Baisse +15% = problème
            - **Stats personnages**: équilibrées ~10, aucune < 7 ou > 13

            ## 2. Recherche web (rapide et ciblée)

            Fais des recherches **utiles mais efficaces** (pas de veille large) :
            - **2 à 3 recherches max**, requêtes précises et ciblées (ex. un mécanisme précis lié à un signal QA : "idle RPG win rate drop streak protection", "pixel auto-battler loot pity timer").
            - Utilise `websearch` avec des requêtes courtes/spécifiques, puis exploite directement les meilleurs résultats (`webfetch` ciblé si besoin). **Ne délègue pas** à un sous-agent `explore` pour de la recherche générique.
            - But : valider/éclairer une piste issue concrète, pas produire un rapport de tendance. Si les stats QA suffisent, 0-1 recherche.

            ## 3. Analyser les commits récents
            - git log --oneline -30
            - Regarde les tendances : bugs fréquents, features ajoutées, domaines négligés

            ## 4. Actions à réaliser (moins d'issues, plus pertinentes)

            **Qualité > quantité. Maximum 2 nouvelles issues par run** (idéalement 0 ou 1). Crée une issue **seulement** si elle est actionnable et étayée par un signal QA concret, un bug avéré dans les commits/logs, ou une conclusion claire d'une recherche ciblée. Si rien n'est clairement actionnable, **ne crée rien** : un run sans nouvelle issue est un bon run.

            Pour chaque piste :
            1. Vérifie si une issue similaire existe déjà (liste ci-dessus)
            2. **Si oui** → commente l'issue existante avec les données nouvelles (préféré à une nouvelle issue)
            3. **Si non et vraiment pertinent** → crée 1 issue (regroupe les points liés en une seule issue plutôt que d'en ouvrir plusieurs)
            4. **Spéculatif / nice-to-have / non étayé** → n'ouvre pas d'issue

            Types d'issues (uniquement si le seuil de pertinence est atteint) :
            - **Mineures** avec /oc (ajustement de constante chiffré, bug reproductible, petite feature claire)
            - **Majeures** SANS /oc avec analyse détaillée

            Ferme les issues résolues par les commits récents (avec preuve).

            Format pour commenter une issue existante:
            gh issue comment #NUM --body '📊 Mise à jour: [date]
            - Nouvelles données QA: [contexte]
            - Suggestion: [ajustement si nécessaire]'

            Format pour fermer une issue résolue:
            gh issue close #NUM --comment 'Fermé: résolu par [commit/PR #]. Les stats QA récentes confirment.'

            Chaque proposition majeure doit inclure :
            - Pourquoi c'est adapté à Bitbrawler (mobile, pixel, idle)
            - Impact estimé sur la rétention
            - Effort estimé (1-5)
            - Inspiré de quels jeux/recherches"

          # Les slugs *-free tombent en ~3 s sur le quota partage ; Z.AI doit
          # avoir le temps de lire les stats et créer les issues (budget primaire).
          # Recherches ciblées (2-3 max) + peu d'issues (<=2) : efficace, peu de quota.
          MODEL_BUDGETS=("8m" "5m" "4m" "12m")
          SUCCESS=0
          MODEL_IDX=0
          for MODEL in "${MODELS[@]}"; do
            MODEL_BUDGET="${MODEL_BUDGETS[$MODEL_IDX]}"
            MODEL_IDX=$((MODEL_IDX + 1))
            echo "Trying model: $MODEL (budget $MODEL_BUDGET)"
            if bash scripts/run-agent-model.sh --budget "$MODEL_BUDGET" --agent tech-lead \
              --model "$MODEL" --prompt "$PROMPT"; then
              echo "Model selected: $MODEL"
              SUCCESS=1
              break
            fi
            echo "Model failed: $MODEL"
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "All model attempts failed."
            exit 1
          fi

      - name: Dispatch OpenCode for freshly created bot issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUES_FILE=/tmp/tech-lead-issues.txt

          gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&sort=created&direction=desc&per_page=100&since=${TECH_LEAD_SCAN_START}" \
            --jq '.[] | select(.pull_request | not) | @base64' > "$ISSUES_FILE"

          FOUND=0
          while IFS= read -r row; do
            [ -z "$row" ] && continue

            json=$(printf '%s' "$row" | base64 --decode)
            number=$(echo "$json" | jq -r '.number')
            author=$(echo "$json" | jq -r '.user.login // ""')
            created_at=$(echo "$json" | jq -r '.created_at')
            body=$(echo "$json" | jq -r '.body // ""')
            labels=$(echo "$json" | jq -r '[.labels[].name] | join(",")')

            if [[ "$created_at" < "$TECH_LEAD_SCAN_START" ]]; then
              continue
            fi

            if [ "$author" != "github-actions[bot]" ] && [ "$author" != "app/github-actions" ] && [ "$author" != "opencode-agent" ]; then
              continue
            fi

            # Skip déjà dispatchées (anti fan-out avec les scans opencode concurrents)
            if echo "$labels" | grep -qiE '(^|,)dispatched(,|$)'; then
              continue
            fi

            if ! printf '%s' "$body" | grep -qiE '(^|[[:space:]])/(oc|opencode)($|[[:space:]])'; then
              continue
            fi

            echo "Dispatching OpenCode workflow for issue #$number..."
            gh issue edit "$number" --add-label dispatched 2>/dev/null || true
            gh workflow run opencode.yml -f issue_number="$number"
            FOUND=1
          done < "$ISSUES_FILE"

          if [ "$FOUND" -eq 0 ]; then
            echo "No fresh bot-created /oc issues found."
          fi
