name: PR Reviewer

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string
      ci_green:
        description: Set to true when dispatched from a green CI run (skip CI wait)
        required: false
        default: 'false'
        type: string

concurrency:
  group: pr-review-${{ github.event.inputs.pr_number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Resolve PR number from event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.inputs.pr_number }}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "⛔ CI run concluded with ${{ github.event.workflow_run.conclusion }} — skipping review"
              exit 1
            fi
            PR_NUMBER="${PR_NUMBER:-$(echo '${{ toJson(github.event.workflow_run.pull_requests) }}' | jq -r '.[0].number // empty')}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUMBER="${PR_NUMBER:-${{ github.event.pull_request.number }}}"
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "⚠ No PR number available — nothing to review"
            exit 0
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "✅ Resolved PR number: $PR_NUMBER"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Install dependencies
        run: npm ci

      - name: Wait briefly for CI checks (skip when dispatched from green CI)
        id: wait-ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ env.PR_NUMBER }}"
          echo "PR number: $PR_NUMBER"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

          # Quand ci.yml nous dispatche juste après un succès, la CI est déjà verte
          # — re-poller gaspille ~30s et peut donner un faux positif pendant que statusCheckRollup se stabilise.
          if [ "${{ github.event.inputs.ci_green }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "✅ CI déjà passée avant dispatch — skip attente CI."
            exit 0
          fi

          # Pour pull_request (fallback direct), la CI vient juste de démarrer en parallèle → attendre plus longtemps
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MAX_WAIT=6
            echo "Trigger pull_request — attente CI sur PR #$PR_NUMBER (max 60s)..."
          else
            MAX_WAIT=3
            echo "Dispatch manuel — attente brève CI sur PR #$PR_NUMBER (max 30s)..."
          fi
          for i in $(seq 1 $MAX_WAIT); do
            # Count checks that are not completed or not successful/neutral (hors Vercel et hors review lui-même)
            CHECKS=$(gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '
              [.statusCheckRollup[]? | select((.app?.slug != "vercel") and (.name? != "Vercel") and (.context? != "Vercel")) | select(.name != "review" and .name != "PR Reviewer" and (.name | test("review";"i") | not)) | select(
                .status? != "COMPLETED" or (.conclusion? != "SUCCESS" and .conclusion? != "NEUTRAL")
              )] | length
            ' 2>/dev/null || echo "3")
            if [ "$CHECKS" -eq 0 ]; then
              echo "✓ All CI checks passed!"
              exit 0
            fi
            echo "⏳ Attente... ($i/$MAX_WAIT, $CHECKS checks restants)"
            sleep 10
          done

          echo "⚠ Timeout attente CI — on continue le review (Vercel ou checks lents supposés)."
          # Proceed with review even if some checks are still pending

      - name: Check PR author for self-review bypass
        id: check-author
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ env.PR_NUMBER }}"
          IS_BOT=$(gh pr view "$PR_NUMBER" --json author --jq '.author.is_bot // false' 2>/dev/null || echo "false")
          if [ "$IS_BOT" = "true" ]; then
            echo "Auto-authored PR — will merge directly without approval"
            echo "SKIP_APPROVAL=true" >> "$GITHUB_ENV"
          else
            echo "Human-authored PR — normal approval process"
            echo "SKIP_APPROVAL=false" >> "$GITHUB_ENV"
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"

      - name: Load agent memory context
        run: |
          echo "📖 Compacting memories (ARG_MAX guard)…"
          node scripts/compact-memories.mjs || true
          echo "📖 Loading memory context (branche memory si existe)..."
          git fetch origin memory:refs/remotes/origin/memory 2>/dev/null || git fetch origin memory/dev:refs/remotes/origin/memory/dev 2>/dev/null || true
          REV_SRC=".opencode/memory/reviewer.json"
          if git show-ref --verify --quiet refs/remotes/origin/memory 2>/dev/null; then
            git show refs/remotes/origin/memory:.opencode/memory/reviewer.json > /tmp/memory_reviewer.json 2>/dev/null || cp "$REV_SRC" /tmp/memory_reviewer.json 2>/dev/null || echo '{}' > /tmp/memory_reviewer.json
            echo "✓ Mémoire reviewer restaurée depuis origin/memory (temp file)"
            REV_SRC="/tmp/memory_reviewer.json"
          elif git show-ref --verify --quiet refs/remotes/origin/memory/dev 2>/dev/null; then
            git show refs/remotes/origin/memory/dev:.opencode/memory/reviewer.json > /tmp/memory_reviewer.json 2>/dev/null || cp "$REV_SRC" /tmp/memory_reviewer.json 2>/dev/null || echo '{}' > /tmp/memory_reviewer.json
            echo "✓ Mémoire reviewer restaurée depuis origin/memory/dev (temp file)"
            REV_SRC="/tmp/memory_reviewer.json"
          fi
          REV_TRUNC=$(jq -c '{version, recent_notes: (.session_notes // [])[-5:], known_limitations}' "$REV_SRC" 2>/dev/null | tr -d '\n' || echo '{}')
          SHARED_TRUNC=$(jq -c '{version, known_issues: (.known_issues // [])[-3:], cross_agent_constraints}' .opencode/memory/shared.json 2>/dev/null | tr -d '\n' || echo '{}')
          echo "REVIEWER_MEMORY=$REV_TRUNC" >> "$GITHUB_ENV"
          echo "SHARED_MEMORY=$SHARED_TRUNC" >> "$GITHUB_ENV"
          echo "✅ Memory loaded (tronquée)"

      - name: Configure git
        run: |
          git config user.name "opencode-agent"
          git config user.email "agent@opencode.ai"

      - name: Verify branch integrity before review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ env.PR_NUMBER }}"
          HEAD_REF=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName // ""' 2>/dev/null || echo "")

          if [ -z "$HEAD_REF" ]; then
            echo "⚠ Could not determine head ref — skipping integrity check"
            exit 0
          fi

          echo "🔍 Checking out PR branch: $HEAD_REF"
          git fetch origin "$HEAD_REF"
          # Force checkout: the memory-compaction step may have modified
          # .opencode/memory/*.json in the working tree (master version);
          # a plain checkout aborts when the PR branch also touches them.
          git checkout -f "$HEAD_REF" 2>/dev/null || git checkout -f -B "$HEAD_REF" "origin/$HEAD_REF"
          # Re-compact AFTER switching: injected memories must reflect the
          # PR branch content AND stay under the ARG_MAX budget.
          node scripts/compact-memories.mjs || true

          echo "🔍 Checking for merge conflict markers..."
          if grep -rnP '^<<<<<<< |^=======$|^>>>>>>> ' --include='*.ts' --include='*.tsx' --include='*.json' src/; then
            echo "❌ Conflict markers found — requesting changes"
            gh pr review "$PR_NUMBER" --request-changes --body "❌ Des marqueurs de conflit (\`<<<<<<<\`) sont présents dans le code. Le merge auto a échoué. Merci de rebase manuellement sur master et de résoudre les conflits."
            exit 1
          fi
          echo "✅ No conflict markers found"

          echo "🔍 Checking TypeScript compilation..."
          if ! npx tsc --noEmit; then
            echo "❌ TypeScript errors — preventing merge"
            gh pr review "$PR_NUMBER" --request-changes --body "❌ Le code contient des erreurs TypeScript. Le merge automatique a probablement corrompu des fichiers (conflits silencieux). Merci de corriger et repousser."
            exit 1
          fi
          echo "✅ TypeScript compilation clean — branch ready for review"

          # Bot PR heads end with a session-memory commit "[skip ci]", which
          # makes GitHub ignore the pull_request CI trigger → the PR carries no
          # CI checks at all. In that case we run the full validation gate on
          # the PR branch ourselves so the reviewer never merges untested code.
          CHECK_COUNT=$(gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '[.statusCheckRollup[]? | select((((.app?.name // .name // .context // .app?.slug // "") | ascii_downcase | contains("vercel")) | not) and ((.name // "") | test("review";"i") | not))] | length' 2>/dev/null || echo "0")
          if [ "$CHECK_COUNT" -eq 0 ]; then
            echo "🔍 No CI checks attached to PR #$PR_NUMBER (skip-ci head?) — running full validation locally..."
            if ! (npm run lint && npx tsc --noEmit && npm test && npm run build); then
              echo "❌ Full validation failed on the PR branch — preventing merge"
              gh pr review "$PR_NUMBER" --request-changes --body "❌ La validation complète (lint, tsc, tests, build) a échoué sur la branche de cette PR. Le commit de tête \`[skip ci]\` a désactivé CI, donc le reviewer a exécuté la validation lui-même. Merci de corriger et de repousser."
              exit 1
            fi
            echo "✅ Full validation passed on the PR branch (reviewer gate)"
          else
            echo "✅ $CHECK_COUNT CI checks attached to PR #$PR_NUMBER — validation is covered by CI"
          fi

      - name: Check dependencies (depends-on resolution)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ env.PR_NUMBER }}"
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""' 2>/dev/null || echo "")
          ISSUE_NUMBER=$(echo "$PR_BODY" | grep -oiE '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#[0-9]+' | grep -oE '#[0-9]+' | tr -d '#' | head -1 || echo "")

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "ℹ No linked issue — skipping dependency check"
            echo "DEPS_BLOCKED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # Extract all depends-on from issue body (supports "depends-on: #a, #b, #c")
          DEPS=$(gh issue view "$ISSUE_NUMBER" --json body --jq '.body' 2>/dev/null | grep -oiE 'depends-on:\s*#[0-9]+([,\s]*#[0-9]+)*' | grep -oE '#[0-9]+' | tr -d '#' || echo "")
          echo "DEPS_LIST=$(echo "$DEPS" | tr '\n' ',')" >> "$GITHUB_ENV"

          if [ -z "$DEPS" ]; then
            echo "ℹ Issue #$ISSUE_NUMBER has no dependencies"
            echo "DEPS_BLOCKED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "🔍 Dependencies found: #$(echo "$DEPS" | tr '\n' ' ')"
          ALL_RESOLVED=true
          for DEP in $DEPS; do
            DEP_STATE=$(gh issue view "$DEP" --json state --jq '.state' 2>/dev/null || echo "OPEN")
            if [ "$DEP_STATE" != "CLOSED" ]; then
              echo "⛔ Dependency #$DEP is still open — PR #$PR_NUMBER blocked"
              ALL_RESOLVED=false
            else
              DEP_PR=$(gh pr list --state merged --head "feat/auto-$DEP" --json number --jq '.[0].number' 2>/dev/null || echo "")
              if [ -z "$DEP_PR" ]; then
                echo "⚠ Dependency #$DEP is closed but no merged PR found — manual check advised"
              else
                echo "✓ Dependency #$DEP resolved by PR #$DEP_PR"
              fi
            fi
          done

          if [ "$ALL_RESOLVED" = false ]; then
            echo "⏳ Dependencies not yet resolved — posting comment and skipping review"
            BODY="⏳ **En attente de dépendances** — Cette PR sera mergée automatiquement quand les dépendances suivantes seront fermées :"
            while read -r D; do
              BODY="$BODY"$'\n'"- #$D"
            done <<< "$(echo "$DEPS")"
            BODY="$BODY"$'\n\n'"Le reviewer repassera automatiquement dès que toutes les dépendances seront résolues."
            gh pr comment "$PR_NUMBER" --body "$BODY"
            # Remove auto-merge if set (prevent premature merge)
            gh pr merge --disable-auto "$PR_NUMBER" 2>/dev/null || true
            echo "DEPS_BLOCKED=true" >> "$GITHUB_ENV"
          else
            echo "✅ All dependencies resolved"
            echo "DEPS_BLOCKED=false" >> "$GITHUB_ENV"
          fi

      - name: Detect SQL migration in PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ env.PR_NUMBER }}"
          PR_DIFF=$(gh pr diff "$PR_NUMBER" 2>/dev/null || echo "")

          # Check for SQL ALTER TABLE / CREATE TABLE statements (only in .ts/.tsx/.sql files)
          SQL_CONTENT=$(echo "$PR_DIFF" | awk '/^diff --git/{f=0} /^diff --git.*\.(ts|tsx|sql)$/{f=1} f' | grep -qiE '(ALTER TABLE|CREATE TABLE|DROP TABLE|CREATE INDEX|ALTER COLUMN)' && echo "yes" || echo "")
          if [ -n "$SQL_CONTENT" ]; then
            echo "⛔ SQL migration detected in PR #$PR_NUMBER — blocking merge"
            gh pr review "$PR_NUMBER" --request-changes --body \
              "⛔ **Migration SQL détectée dans le code.** Conformément aux règles du projet, toute modification de schéma doit passer par une issue de migration séparée, exécutée manuellement dans Supabase Dashboard.\n\nMerci de retirer les instructions SQL de cette PR et de créer une issue de migration avec le format décrit dans AGENTS.md."
            exit 1
          fi
          echo "✅ No SQL migration detected"

      - name: Gate on current CI status (block merge if not green)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ env.PR_NUMBER }}"

          # Fresh check of the PR's checks at review time — never rely on a stale
          # status from the dispatch moment. The agent LLM must not be the only
          # guard here; this step hard-blocks review if CI is red.
          CHECKS=$(gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '
            [.statusCheckRollup[]? | select((.app?.slug != "vercel") and (.name? != "Vercel") and (.context? != "Vercel")) | select(.name != "review" and .name != "PR Reviewer" and (.name | test("review";"i") | not)) | select(
              .status? != "COMPLETED" or (.conclusion? != "SUCCESS" and .conclusion? != "NEUTRAL")
            )] | length
          ' 2>/dev/null || echo "1")

          if [ "$CHECKS" -gt 0 ]; then
            echo "⛔ CI not green at review time ($CHECKS failing/pending check(s)) — blocking review"
            gh pr review "$PR_NUMBER" --request-changes --body "⛔ La CI n'est pas verte au moment du merge ($CHECKS check(s) en échec ou en attente). Corrige et repousse — le reviewer repassera automatiquement." 2>/dev/null || true
            echo "CI_GATE_BLOCKED=true" >> "$GITHUB_ENV"
          else
            echo "✅ CI green at review time"
            echo "CI_GATE_BLOCKED=false" >> "$GITHUB_ENV"
          fi

      - name: Skip reviewer if dependencies blocked
        if: env.DEPS_BLOCKED == 'true'
        run: |
          echo "⏳ Dependencies not resolved — reviewer skipped. Will re-trigger when dependencies merge."

      - name: Skip reviewer if CI gate blocked
        if: env.CI_GATE_BLOCKED == 'true'
        run: |
          echo "⛔ CI gate blocked — reviewer skipped. PR will be reviewed once CI is green."

      - name: Run Reviewer agent
        if: env.DEPS_BLOCKED != 'true' && env.CI_GATE_BLOCKED != 'true'
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SKIP_APPROVAL: ${{ env.SKIP_APPROVAL }}
          DEPS_LIST: ${{ env.DEPS_LIST }}
        run: |
          PR_DIFF=$(gh pr diff "$PR_NUMBER" 2>/dev/null || echo "")
          # ARG_MAX guard: huge diffs (generated assets) blow the CLI argv limit
          if [ ${#PR_DIFF} -gt 40000 ]; then
            PR_DIFF="$(echo "$PR_DIFF" | head -c 40000)

          … [diff truncated at 40k chars — see PR files]"
          fi
          PR_TITLE=$(gh pr view "$PR_NUMBER" --json title --jq '.title // ""' 2>/dev/null || echo "")
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""' 2>/dev/null || echo "")
          HEAD_REF=$(gh pr view "$PR_NUMBER" --json headRefName --jq '.headRefName // ""' 2>/dev/null || echo "")

          # Extract linked issue from PR body (Closes #N or Fixes #N)
          ISSUE_NUMBER=$(echo "$PR_BODY" | grep -oE '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#[0-9]+' | grep -oE '#[0-9]+' | tr -d '#' | head -1 || echo "")

          ISSUE_BODY=""
          ISSUE_TITLE=""
          if [ -n "$ISSUE_NUMBER" ]; then
            ISSUE_TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title // ""' 2>/dev/null || echo "")
            ISSUE_BODY=$(gh issue view "$ISSUE_NUMBER" --json body --jq '.body // ""' 2>/dev/null || echo "")
          fi

          MODEL_ATTEMPTS=0
          MODELS=(
            "opencode/muse-spark-1.2-contributor-free"
            "opencode/nemotron"
          )

          PROMPT="Tu es le reviewer de Bitbrawler. Tu réponds et agis UNIQUEMENT EN FRANÇAIS. Review la PR #${PR_NUMBER}.

            ## PR : ${PR_TITLE}
            \`\`\`
            ${PR_DIFF}
            \`\`\`

            ## Issue liée #${ISSUE_NUMBER:-"aucune"}
            Titre: ${ISSUE_TITLE:-"N/A"}
            Body: ${ISSUE_BODY:-"N/A"}

            ## Mémoire OBLIGATOIRE à consulter (tronquée à 5 dernières leçons)
            Mémoire REVIEWER : $(jq -c '{version, recent_notes: (.session_notes // [])[-5:], known_limitations}' .opencode/memory/reviewer.json 2>/dev/null || echo "{}")
            Mémoire commune : $(jq -c '{version, known_issues: (.known_issues // [])[-3:], cross_agent_constraints}' .opencode/memory/shared.json 2>/dev/null || echo "{}")

            ## Dépendances de cette PR
            Dépendances déclarées : $DEPS_LIST
            Toutes les dépendances sont résolues ✅ — cette PR peut être mergée dans l'ordre du DAG.

            ## Instructions de review (en français)

            1. **Pertinence** : le code résout-il le problème décrit dans l'issue liée ? Si pas d'issue liée, le changement a-t-il du sens ?
            2. **Périmètre** : y a-t-il des modifications non liées à l'issue (scope creep) ? Un petit hotfix/bug/stats est OK à merger vite, un gros changement nécessite plus de rigueur.
            3. **Conventions du projet** :
               - Pas de commentaires dans le code
               - Pas de \`any\` TypeScript
               - Imports propres (pas d'imports inutilisés)
               - Pas de duplication de code
            4. **Commits** : le message suit conventional commits (feat:/fix:/refactor:/chore:/test:)
            5. **Tests** : les nouveaux cas sont-ils testés ? Les tests existants passent-ils toujours ?
            6. **Régression** : le changement peut-il casser une autre partie du projet ?
            7. **Sécurité** : pas d'injection SQL Supabase, pas de secrets exposés
            8. **Performance** : pas de boucles inutiles, pas de requêtes N+1 Supabase

             ## Règles STRICTES (en français)
            - ⚠️ **AVANT de merger** : re-vérifie la CI à l'instant T avec \`gh pr view "$PR_NUMBER" --json statusCheckRollup\`. Exclue les checks Vercel (app.slug == "vercel" OU name == "Vercel"). Si un seul check non-Vercel n'est pas COMPLETED avec conclusion SUCCESS/NEUTRAL → \`gh pr review "$PR_NUMBER" --request-changes --body \"...en français...\"\` et ne merge PAS. Cela va automatiquement re-déclencher le dev agent avec mémoire pour corriger.
            - Si SKIP_APPROVAL=true (PR auto-générée par bot) → passe directement au merge sans approval: \`gh pr merge "$PR_NUMBER" --squash --delete-branch\` (après re-vérification CI verte)
            - Sinon, si CI est verte ✅ et tout est bon → \`gh pr review --approve "$PR_NUMBER" --body \"✅ Review en français...\"\` puis \`gh pr merge "$PR_NUMBER" --squash --delete-branch\`
            - Si CI est rouge → \`gh pr review "$PR_NUMBER" --request-changes --body \"feedback en français...\"\` même si l'erreur est préexistante (cela déclenche le dev agent qui corrigera avec mémoire)
            - NE JAMAIS approuver si CI est rouge
            - NE JAMAIS merge si le code a des problèmes de sécurité
            - Si le changement semble bon mais mérite un suivi, approuve + crée une issue de suivi avec \`gh issue create\` (titre et body en français, terminée par /oc)
            - ⚠️ Issue de suivi = UNE SEULE COMMANDE, body UNE ligne courte sans guillemets/backticks, terminée par /oc. REMPLACE OBLIGATOIREMENT les placeholders par du contenu réel — NE COPIE JAMAIS l'exemple verbatim :
            NEW_ISSUE_URL=\$(gh issue create --title "fix: exemple — invente un vrai titre descriptif" --body "Phrase unique decrivant le suivi concret. /oc")
            Puis dispatch best-effort: gh workflow run opencode.yml -f issue_number=\${NEW_ISSUE_URL##*/} || true
            Ne JAMAIS réessayer plus de 2 fois; ne JAMAIS créer une issue sans titre/body substantiels
            ⛔ INTERDIT de laisser litteralement "<titre court>", "<resume en une phrase", "description courte et concrete" ou "Phrase unique" — toute issue avec ces placeholders sera auto-fermee et comptera comme echec (exemple = piège)
            - Nettoie la branche après merge
            - TOUS tes commentaires / reviews / bodies DOIVENT être en français
            - Évalue la taille : petit bug/hotfix/stats → merge rapide si CI verte ; gros changement → vérifie tests + régression plus strictement

            Variable d'environnement disponible: SKIP_APPROVAL=$SKIP_APPROVAL"

          SUCCESS=0
          for MODEL in "${MODELS[@]}"; do
            MODEL_ATTEMPTS=$((MODEL_ATTEMPTS + 1))
            echo "Trying model: $MODEL (attempt $MODEL_ATTEMPTS)"
            if opencode run --dangerously-skip-permissions --agent reviewer --model "$MODEL" "$PROMPT"; then
              echo "Model selected: $MODEL"
              SUCCESS=1
              break
            fi
             echo "Model failed: $MODEL"
           done

           if [ "$SUCCESS" -ne 1 ]; then
             echo "All model attempts failed."
             gh pr comment "$PR_NUMBER" --body "❌ Reviewer agent unavailable. Manual review required."
             exit 1
           fi

      - name: Auto-close linked issue if not already closed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ env.PR_NUMBER }}"

          # Get PR body to find "Closes #XYZ"
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""' 2>/dev/null || echo "")

          # Extract issue number from PR body (Closes #N pattern)
          ISSUE_NUMBER=$(echo "$PR_BODY" | grep -oiE '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#[0-9]+' | grep -oE '#[0-9]+' | tr -d '#' | head -1 || echo "")

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "ℹ No linked issue found in PR body"
            exit 0
          fi

          # Check if PR was merged
          PR_STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state' 2>/dev/null || echo "")
          if [ "$PR_STATE" != "MERGED" ]; then
            echo "ℹ PR not merged (state: $PR_STATE), skipping issue close"
            exit 0
          fi

          # Check if issue is still open
          ISSUE_STATE=$(gh issue view "$ISSUE_NUMBER" --json state --jq '.state' 2>/dev/null || echo "")
          if [ "$ISSUE_STATE" = "CLOSED" ]; then
            echo "✓ Issue #$ISSUE_NUMBER already closed"
            exit 0
          fi

          # Close the issue
          echo "Closing issue #$ISSUE_NUMBER..."
          gh issue close "$ISSUE_NUMBER" --comment "Resolved by PR #$PR_NUMBER (merged)"
          echo "✓ Issue #$ISSUE_NUMBER closed"

      - name: Re-trigger reviewer for dependant PRs (DAG order)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ env.PR_NUMBER }}"
          PR_STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state' 2>/dev/null || echo "")
          if [ "$PR_STATE" != "MERGED" ]; then
            echo "ℹ PR not merged — skipping dependant re-dispatch"
            exit 0
          fi

          # Get the issue that this PR closed
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""' 2>/dev/null || echo "")
          CLOSED_ISSUE=$(echo "$PR_BODY" | grep -oiE '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#[0-9]+' | grep -oE '#[0-9]+' | tr -d '#' | head -1 || echo "")
          if [ -z "$CLOSED_ISSUE" ]; then
            echo "ℹ No linked issue found — skipping dependant re-dispatch"
            exit 0
          fi

          echo "🔍 PR #$PR_NUMBER merged — looking for PRs that depend on #$CLOSED_ISSUE..."
          # Find open issues whose body contains "depends-on: ... #CLOSED_ISSUE ..." (comma-separated lists supported)
          DEPENDANT_ISSUES=$(gh issue list --state open --json number,body --jq '
            .[] | select(.body | test("depends-on:\\s*(#[0-9]+[,\\s]*)*#'"$CLOSED_ISSUE"'", "i")) | .number
          ' 2>/dev/null || echo "")

          if [ -z "$DEPENDANT_ISSUES" ]; then
            echo "ℹ No open issues depend on #$CLOSED_ISSUE"
            exit 0
          fi

          echo "📋 Found dependant issues: #$(echo "$DEPENDANT_ISSUES" | tr '\n' ' ')"
          for DEP_ISSUE in $DEPENDANT_ISSUES; do
            # Find the open PR for this issue
            DEP_PR=$(gh pr list --state open --head "feat/auto-$DEP_ISSUE" --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -z "$DEP_PR" ]; then
              echo "⚠ No open PR found for issue #$DEP_ISSUE"
              continue
            fi
            echo "🔄 Re-triggering reviewer for PR #$DEP_PR (issue #$DEP_ISSUE) — dependency #$CLOSED_ISSUE now resolved"
            gh workflow run reviewer.yml -f pr_number="$DEP_PR" --repo "${{ github.repository }}"
            echo "✓ Reviewer re-triggered for PR #$DEP_PR"
            sleep 3
          done


      - name: Cleanup empty bot issues (quote-fumble guard)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE=$(date -u -d '40 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          # gh's --jq ne supporte pas --arg ; on utilise jq binaire + filtre placeholder explicite
          gh issue list --state open --author app/github-actions --limit 30 --json number,title,body,createdAt \
            | jq -r --arg since "$SINCE" '.[] | select(.createdAt > $since and ((.title == "<titre court>") or (.title == "fix: description courte et concrete") or (.title | contains("description courte et concrete")) or (.body | contains("<titre court>")) or (.body | contains("<resume en une phrase")) or (.body | contains("description courte et concrete")) or (.body | contains("Phrase unique")) or (.body | length < 30))) | .number' | while read N; do
            [ -z "$N" ] && continue
            echo "Closing placeholder/empty issue #$N"
            gh issue close "$N" --comment "Auto-cleanup: issue creee avec placeholder par le reviewer (quoting fumble / exemple copie) — fermee proprement."
          done

      - name: Save reviewer session memory
        if: always()
        run: |
          if [ -f /tmp/agent-session-notes.json ]; then
            NOTES=$(cat /tmp/agent-session-notes.json)
            CURRENT=$(cat .opencode/memory/reviewer.json 2>/dev/null || echo '{}')
            UPDATED=$(echo "$CURRENT" | jq --argjson notes "$NOTES" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
              .last_session = $date | .session_notes += [$notes] | .session_notes |= .[-30:]
            ')
            echo "$UPDATED" > /tmp/memory_reviewer_updated.json
            echo "📝 Mémoire reviewer préparée (30 dernières notes)"
            CURR_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "master")
            git stash push -m "reviewer stash" --keep-index 2>/dev/null || true
            git fetch origin memory 2>/dev/null || git fetch origin memory/dev 2>/dev/null || true
            if git ls-remote --exit-code origin refs/heads/memory >/dev/null 2>&1; then
              git checkout memory 2>/dev/null || git checkout -B memory origin/memory
              git pull origin memory --ff-only 2>/dev/null || true
            elif git ls-remote --exit-code origin refs/heads/memory/dev >/dev/null 2>&1; then
              git checkout memory/dev 2>/dev/null || git checkout -B memory origin/memory/dev
              git pull origin memory/dev --ff-only 2>/dev/null || true
            else
              git checkout --orphan memory 2>/dev/null || git checkout -B memory
              git rm -rf . 2>/dev/null || true
              mkdir -p .opencode/memory
            fi
            mkdir -p .opencode/memory
            cp /tmp/memory_reviewer_updated.json .opencode/memory/reviewer.json
            git add .opencode/memory/reviewer.json
            git commit -m "chore: update reviewer memory" 2>/dev/null || true
            git push origin HEAD:memory 2>&1 | head -20 || git push origin memory 2>&1 | head -20 || git push origin memory/dev 2>&1 | head -20 || echo "⚠ push memory échoué"
            git checkout "$CURR_BRANCH" 2>/dev/null || git checkout master 2>/dev/null || true
            git stash pop 2>/dev/null || true
            echo "✅ Reviewer memory poussée sur origin/memory (pas de [skip ci] sur PR)"
          else
            echo "ℹ No session notes found"
          fi
        shell: bash

      - name: Check campaign — dispatch supervisor if all sub-issues done
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ env.PR_NUMBER }}"
          PR_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body // ""' 2>/dev/null || echo "")
          ISSUE_NUMBER=$(echo "$PR_BODY" | grep -oiE '(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#[0-9]+' | grep -oE '#[0-9]+' | tr -d '#' | head -1 || echo "")
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "ℹ No linked issue — skipping campaign check"
            exit 0
          fi
          # Check if issue has campaign-* labels
          CAMPAIGN_LABELS=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name | select(startswith("campaign-"))] | .[]' 2>/dev/null || echo "")
          if [ -z "$CAMPAIGN_LABELS" ]; then
            echo "ℹ Issue #$ISSUE_NUMBER is not part of a campaign — skipping"
            exit 0
          fi
          for CAMPAIGN in $CAMPAIGN_LABELS; do
            PARENT_NUMBER=$(echo "$CAMPAIGN" | sed 's/campaign-//')
            echo "🔍 Checking campaign $CAMPAIGN (parent issue #$PARENT_NUMBER)..."
            REMAINING=$(gh issue list --label "$CAMPAIGN" --state open --json number --jq 'length' 2>/dev/null || echo "1")
            if [ "$REMAINING" -eq 0 ]; then
              echo "✅ All sub-issues of campaign $CAMPAIGN are closed!"
              echo "Dispatching supervisor for parent issue #$PARENT_NUMBER..."
              gh workflow run opencode.yml -f issue_number="$PARENT_NUMBER" -f mode=supervisor --repo "${{ github.repository }}"
              echo "✓ Supervisor dispatched for #$PARENT_NUMBER"
            else
              echo "⏳ $REMAINING sub-issue(s) still open in campaign $CAMPAIGN — waiting"
            fi
          done