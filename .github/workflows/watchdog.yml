name: Watchdog — PR orphelines & CI rouge

on:
  schedule:
    - cron: '17 * * * *' # 1x/h à 17min, évite la pile 00
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # 5min suffisaient pour le seul scan de PRs. Le reclaim stale-claims ajoute
    # jusqu'à ~3 appels API par issue claimée (plafonné à 10) → on passe à 10min.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sweep PRs orphelines et CI rouge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔍 Watchdog 1/h — scan des PRs bot (label auto-generated OU auteur github-actions)"
          gh label get "ci-needs-human" 2>/dev/null || gh label create "ci-needs-human" --color "d73a4a" --description "CI bloquée après 3 retries, intervention humaine requise" 2>/dev/null || true
          gh label get "needs-rebase" 2>/dev/null || gh label create "needs-rebase" --color "fbca04" --description "PR en conflit avec master, rebase manuel requis" 2>/dev/null || true
          # NOTE: ne pas filtrer côté serveur par --label auto-generated : les PRs bot
          # créées quand le label manquait n'ont aucun label et devenaient invisibles
          # (orphelines à 0 check, jamais redispatchées — incident sept 2026 : 7 PRs bloquées).
          gh pr list --state open --json number,updatedAt,statusCheckRollup,headRefName,headRefOid,body,author,labels,mergeable --limit 50 > /tmp/prs-all.json 2>/dev/null || echo "[]" > /tmp/prs-all.json
          jq '[.[] | select(([.labels // [] | .[].name] | index("auto-generated")) or (.author.login == "app/github-actions"))]' /tmp/prs-all.json > /tmp/prs.json 2>/dev/null || echo "[]" > /tmp/prs.json
          COUNT=$(jq 'length' /tmp/prs.json 2>/dev/null || echo 0)
          echo "📋 $COUNT PRs bot ouvertes (labellisées ou auteur github-actions)"
          DISPATCHED=0
          MAX_DISPATCH=3
          NOW=$(date -u +%s)
          for i in $(seq 0 $((COUNT-1))); do
            [ "$DISPATCHED" -ge "$MAX_DISPATCH" ] && { echo "⏭ Max $MAX_DISPATCH dispatches atteint, arrêt"; break; }
            PR=$(jq -c ".[$i]" /tmp/prs.json)
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            HEAD_REF=$(echo "$PR" | jq -r '.headRefName // ""')
            UPDATED_AT=$(echo "$PR" | jq -r '.updatedAt // ""')
            BODY=$(echo "$PR" | jq -r '.body // ""')
            MERGEABLE=$(echo "$PR" | jq -r '.mergeable // ""')
            ISSUE_NUMBER=$(echo "$BODY" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || echo "")
            # Les PRs en conflit ne seront jamais vertes via un redispatch CI : on les
            # signale une fois (label needs-rebase) au lieu de brûler des minutes CI chaque heure
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "⛔ PR #$PR_NUMBER en CONFLIT avec master — skip redispatch CI (rebase requis)"
              gh pr edit "$PR_NUMBER" --add-label "needs-rebase" 2>/dev/null || true
              continue
            fi
            UPDATED_TS=$(date -d "$UPDATED_AT" +%s 2>/dev/null || echo "$NOW")
            AGE_MIN=$(( (NOW - UPDATED_TS) / 60 ))
            CHECK_COUNT=$(echo "$PR" | jq '[.statusCheckRollup[]?] | length' 2>/dev/null || echo 0)
            FAILED_COUNT=$(echo "$PR" | jq '[.statusCheckRollup[]? | select(.conclusion == "FAILURE")] | length' 2>/dev/null || echo 0)
            echo "--- PR #$PR_NUMBER ($HEAD_REF, ${AGE_MIN}min, $CHECK_COUNT checks, $FAILED_COUNT failed, issue #$ISSUE_NUMBER) ---"
            # PR SANS aucun check = le seul cas où attendre 60 min est trop long. Un run
            # `pull_request` retenu par GitHub (action_required) n'attachera JAMAIS de check,
            # et le redispatch CI n'en attache pas toujours (mesuré sur #1223 le 2026-10-18 :
            # run CI vert à 18:07, rollup toujours vide à 19:10). Dès 30 min on envoie donc
            # le REVIEWER : sans check il exécute sa propre gate (lint/tsc/tests/build).
            if [ "$CHECK_COUNT" -eq 0 ] && [ -n "$HEAD_REF" ]; then
              if [ "$AGE_MIN" -lt 30 ]; then
                echo "⏭ PR #$PR_NUMBER sans check mais récente (${AGE_MIN}min < 30min), skip (seuil orphelines)"
                continue
              fi
              # Anti-tempête : ne JAMAIS rejuger deux fois le même commit. Le reviewer
              # laisse une review APPROVED/CHANGES_REQUESTED portant commit_id = SHA jugé ;
              # si elle existe et n'a pas été dismissée, un nouveau run ne produira rien de
              # neuf (et une PR bloquée brûlerait une gate complète à chaque passage horaire).
              # Un push (nouveau SHA) réarme naturellement la règle.
              HEAD_SHA=$(echo "$PR" | jq -r '.headRefOid // ""')
              REVIEWED=0
              if [ -n "$HEAD_SHA" ]; then
                REVIEWED=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
                  --jq "[.[]? | select(.commit_id == \"$HEAD_SHA\" and (.state == \"APPROVED\" or .state == \"CHANGES_REQUESTED\"))] | length" 2>/dev/null || echo 0)
              fi
              if [ "${REVIEWED:-0}" -gt 0 ]; then
                echo "⏭ PR #$PR_NUMBER : commit ${HEAD_SHA:0:7} déjà jugé (review APPROVED/CHANGES_REQUESTED) — skip"
                continue
              fi
              echo "⚠ PR #$PR_NUMBER orpheline (0 check, >30min) → dispatch reviewer (gate locale)"
              if gh workflow run reviewer.yml -f pr_number="$PR_NUMBER" --repo "${{ github.repository }}" 2>&1; then
                echo "✓ Reviewer dispatché pour #$PR_NUMBER"
                DISPATCHED=$((DISPATCHED+1))
              else
                echo "❌ dispatch reviewer échoué pour #$PR_NUMBER"
              fi
              sleep 2
              continue
            fi
            if [ "$AGE_MIN" -lt 60 ]; then
              echo "⏭ PR #$PR_NUMBER trop récente (${AGE_MIN}min), skip"
              continue
            fi
            if [ "$FAILED_COUNT" -gt 0 ] && [ -n "$ISSUE_NUMBER" ]; then
              RETRY_COUNT=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name | select(startswith("ci-retry-"))] | length' 2>/dev/null || echo 0)
              HAS_HUMAN_LABEL=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name | select(. == "ci-needs-human")] | length' 2>/dev/null || echo 0)
              if [ "$RETRY_COUNT" -ge 3 ] || [ "$HAS_HUMAN_LABEL" -gt 0 ]; then
                echo "⛔ PR #$PR_NUMBER déjà à 3 retries ou label ci-needs-human, skip"
                continue
              fi
              echo "❌ PR #$PR_NUMBER CI rouge ($FAILED_COUNT failed), retry $RETRY_COUNT → redispatch dev-agent"
              gh issue edit "$ISSUE_NUMBER" --add-label "ci-retry-$((RETRY_COUNT+1))" 2>/dev/null || true
              if gh workflow run opencode.yml -f issue_number="$ISSUE_NUMBER" -f ci_failure=true --repo "${{ github.repository }}" 2>&1 | head -5; then
                echo "✓ Dev-agent redispatché pour #$ISSUE_NUMBER"
                DISPATCHED=$((DISPATCHED+1))
              else
                echo "❌ redispatch dev-agent échoué"
              fi
              sleep 2
              continue
            fi
            echo "✅ PR #$PR_NUMBER OK ou pas d'action"
          done
          echo "🏁 Watchdog terminé: $DISPATCHED dispatch(s) sur $COUNT PRs"

      - name: Reclaim stale `dispatched` claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Filet de sécurité du claim `dispatched` (opencode.yml le relâche sur échec,
          # mais GitHub n'exécute AUCUN step si le job est tué par timeout ou annulé —
          # cas le plus fréquent ici, timeout-minutes: 30). Sans ce filet, un claim
          # posé par un run mort verrouille l'issue POUR TOUJOURS : le scan générique la
          # saute, le watchdog la compte comme "déjà traitée", et seul un dispatch manuel
          # peut la libérer.
          #
          # On ne relâche que ce qui est prouvablement mort : claim posé il y a > 2h
          # (donc tous les runs de 30 min sont terminés) ET aucune PR ouverte ET aucun
          # workflow opencode en cours sur cette issue.
          echo "♻️ Reclaim des claims 'dispatched' périmés (>2h, sans PR, sans run actif)"
          STALE_HOURS=2
          NOW=$(date -u +%s)
          RECLAIMED=0
          MAX_RECLAIM=10

          gh issue list --label dispatched --state open --limit 100 \
            --json number,updatedAt > /tmp/claimed.json 2>/dev/null || echo "[]" > /tmp/claimed.json
          CLAIMED=$(jq 'length' /tmp/claimed.json 2>/dev/null || echo 0)
          echo "📋 $CLAIMED issues portent le claim 'dispatched'"

          # `seq 0 -1` it'dérerait sur des index invalides quand la liste est vide.
          if [ "$CLAIMED" -eq 0 ]; then
            echo "🏁 Reclaim: aucun claim à traiter"
            exit 0
          fi

          for i in $(seq 0 $((CLAIMED-1))); do
            [ "$RECLAIMED" -ge "$MAX_RECLAIM" ] && { echo "⏭ Max $MAX_RECLAIM reclaims atteint, arrêt"; break; }
            ISSUE_NUMBER=$(jq -r ".[$i].number" /tmp/claimed.json)
            UPDATED_AT=$(jq -r ".[$i].updatedAt // \"\"" /tmp/claimed.json)
            UPDATED_TS=$(date -d "$UPDATED_AT" +%s 2>/dev/null || echo "$NOW")
            AGE_MIN=$(( (NOW - UPDATED_TS) / 60 ))
            if [ "$AGE_MIN" -lt $((STALE_HOURS * 60)) ]; then
              continue
            fi
            # Une PR ouverte = travail réellement en vol → ne PAS relâcher.
            if gh pr list --state open --search "$ISSUE_NUMBER in:body" --json number --limit 1 --jq 'length' 2>/dev/null | grep -qv '^0$'; then
              echo "⏭ #$ISSUE_NUMBER (${AGE_MIN}min) a une PR ouverte — claim légitime, skip"
              continue
            fi
            # Un run opencode en cours sur cette issue = claim légitime, skip.
            if gh run list --workflow opencode.yml --status in_progress --limit 20 --json displayTitle \
                 --jq ".[].displayTitle" 2>/dev/null | grep -q "#$ISSUE_NUMBER"; then
              echo "⏭ #$ISSUE_NUMBER (${AGE_MIN}min) a un run opencode en cours — skip"
              continue
            fi
            echo "♻️ #$ISSUE_NUMBER (${AGE_MIN}min, aucune PR, aucun run) → claim relâché"
            gh issue edit "$ISSUE_NUMBER" --remove-label dispatched 2>/dev/null || true
            RECLAIMED=$((RECLAIMED+1))
            sleep 1
          done
          echo "🏁 Reclaim: $RECLAIMED claim(s) relâché(s) sur $CLAIMED"

      - name: Watchdog — campagne terminée mais parent ouvert (filet supervisor)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Le dispatch du supervisor ne vit QUE dans reviewer.yml (step "Check campaign").
          # Quand la dernière sous-issue d'une campagne est mergée par une autre voie
          # (auto-merge inline, merge immédiat), ce step ne tourne jamais : 9/9 fermées
          # mais parent toujours ouvert (incident #1201, 2026-10-18).
          echo "🔍 Campagnes entièrement fermées mais parent encore ouvert ?"
          # On part des issues récemment actives (updated-desc) : parcourir les ~160 labels
          # campaign-* historiques coûterait ~2-3 appels API par label, à chaque passage.
          CAMPAIGNS=$(gh issue list --state all --limit 40 --search "sort:updated-desc" \
            --json labels --jq '[.[].labels[]?.name | select(startswith("campaign-"))] | unique | .[]' 2>/dev/null || echo "")
          if [ -z "$CAMPAIGNS" ]; then
            echo "🏁 Campagnes: rien à traiter"
            exit 0
          fi
          INFLIGHT=$(gh run list --workflow=opencode.yml --status in_progress --status queued --limit 5 --json databaseId --jq 'length' 2>/dev/null || echo 0)
          for LABEL in $CAMPAIGNS; do
            PARENT="${LABEL#campaign-}"
            OPEN_SUBS=$(gh issue list --state open --label "$LABEL" --limit 100 --json number --jq 'length' 2>/dev/null || echo "?")
            if [ "$OPEN_SUBS" != "0" ]; then
              echo "  ⏳ $LABEL : $OPEN_SUBS sous-issue(s) encore ouverte(s)"
              continue
            fi
            PARENT_STATE=$(gh issue view "$PARENT" --json state --jq '.state' 2>/dev/null || echo UNKNOWN)
            if [ "$PARENT_STATE" != "OPEN" ]; then
              echo "  ✓ $LABEL : parent #$PARENT $PARENT_STATE"
              continue
            fi
            DOCS_PR=$(gh pr list --state all --head "docs/campaign-$PARENT" --json number --jq '.[0].number' 2>/dev/null || echo "")
            if [ -n "$DOCS_PR" ]; then
              echo "  ✓ $LABEL : PR docs #$DOCS_PR déjà livrée — clôture de #$PARENT attendue"
              continue
            fi
            # Claim anti-doublon + ré-armement : si le label est là mais qu'aucune PR docs
            # n'existe (run supervisor mort), on le retire et on retente ce passage.
            if gh issue view "$PARENT" --json labels --jq '[.labels[].name]|join(",")' 2>/dev/null | grep -qE '(^|,)supervisor-dispatched(,|$)'; then
              echo "  ⚠ $LABEL : claim supervisor sans PR docs (run mort ?) → ré-armement"
              gh issue edit "$PARENT" --remove-label "supervisor-dispatched" >/dev/null 2>&1 || true
            fi
            if [ "$INFLIGHT" != "0" ]; then
              echo "  ⏳ $LABEL : un run opencode est déjà en cours — dispatch reporté au prochain passage"
              continue
            fi
            echo "  🚀 $LABEL : 0 sous-issue ouverte — dispatch du supervisor pour #$PARENT"
            gh label create "supervisor-dispatched" --color "5319e7" --description "Supervisor déjà dispatché pour cette campagne" 2>/dev/null || true
            gh issue edit "$PARENT" --add-label "supervisor-dispatched" >/dev/null 2>&1 || true
            gh workflow run opencode.yml -f issue_number="$PARENT" -f mode=supervisor --repo "${{ github.repository }}" || echo "  ✗ dispatch supervisor échoué"
            INFLIGHT=$((INFLIGHT+1))
            sleep 3
          done
          echo "🏁 Campagnes: scan terminé"

      - name: Watchdog — fraîcheur du déploiement production (#1228)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La prod a servi pendant des jours un bundle ANTÉRIEUR à master sans
          # aucun signal : HTTP 200, QA verte, aucun crash — seul le contenu du
          # bundle trahissait le décalage (prix shop 24/48/41/73 au lieu de
          # 27/53/45/80). La sonde compare les marqueurs présents dans le bundle
          # live (SPRITE_RENDER_REV + prix shop, deux littéraux qui survivent à la
          # minification) à ceux de master, puis ouvre/ferme le ticket
          # `deploy-stale` — sans jamais créer de doublon.
          #
          # --issue : le ticket EST le signal, la sonde ne fait donc pas échouer
          # ce run quand la prod est stale (sinon un run rouge par heure en plus).
          # Une sonde IMPOSSIBLE (site injoignable) reste un rouge, volontairement.
          npx --yes tsx scripts/check-deploy-freshness.ts --issue
