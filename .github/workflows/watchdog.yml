name: Watchdog — PR orphelines & CI rouge

on:
  schedule:
    - cron: '17 * * * *' # 1x/h à 17min, évite la pile 00
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    # 5min suffisaient pour le seul scan de PRs. Le reclaim stale-claims ajoute
    # jusqu'à ~3 appels API par issue claimée (plafonné à 10) → on passe à 10min.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sweep PRs orphelines et CI rouge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "🔍 Watchdog 1/h — scan des PRs bot (label auto-generated OU auteur github-actions)"
          gh label get "ci-needs-human" 2>/dev/null || gh label create "ci-needs-human" --color "d73a4a" --description "CI bloquée après 3 retries, intervention humaine requise" 2>/dev/null || true
          gh label get "needs-rebase" 2>/dev/null || gh label create "needs-rebase" --color "fbca04" --description "PR en conflit avec master, rebase manuel requis" 2>/dev/null || true
          # NOTE: ne pas filtrer côté serveur par --label auto-generated : les PRs bot
          # créées quand le label manquait n'ont aucun label et devenaient invisibles
          # (orphelines à 0 check, jamais redispatchées — incident sept 2026 : 7 PRs bloquées).
          gh pr list --state open --json number,updatedAt,statusCheckRollup,headRefName,body,author,labels,mergeable --limit 50 > /tmp/prs-all.json 2>/dev/null || echo "[]" > /tmp/prs-all.json
          jq '[.[] | select(([.labels // [] | .[].name] | index("auto-generated")) or (.author.login == "app/github-actions"))]' /tmp/prs-all.json > /tmp/prs.json 2>/dev/null || echo "[]" > /tmp/prs.json
          COUNT=$(jq 'length' /tmp/prs.json 2>/dev/null || echo 0)
          echo "📋 $COUNT PRs bot ouvertes (labellisées ou auteur github-actions)"
          DISPATCHED=0
          MAX_DISPATCH=3
          NOW=$(date -u +%s)
          for i in $(seq 0 $((COUNT-1))); do
            [ "$DISPATCHED" -ge "$MAX_DISPATCH" ] && { echo "⏭ Max $MAX_DISPATCH dispatches atteint, arrêt"; break; }
            PR=$(jq -c ".[$i]" /tmp/prs.json)
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            HEAD_REF=$(echo "$PR" | jq -r '.headRefName // ""')
            UPDATED_AT=$(echo "$PR" | jq -r '.updatedAt // ""')
            BODY=$(echo "$PR" | jq -r '.body // ""')
            MERGEABLE=$(echo "$PR" | jq -r '.mergeable // ""')
            ISSUE_NUMBER=$(echo "$BODY" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || echo "")
            # Les PRs en conflit ne seront jamais vertes via un redispatch CI : on les
            # signale une fois (label needs-rebase) au lieu de brûler des minutes CI chaque heure
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "⛔ PR #$PR_NUMBER en CONFLIT avec master — skip redispatch CI (rebase requis)"
              gh pr edit "$PR_NUMBER" --add-label "needs-rebase" 2>/dev/null || true
              continue
            fi
            UPDATED_TS=$(date -d "$UPDATED_AT" +%s 2>/dev/null || echo "$NOW")
            AGE_MIN=$(( (NOW - UPDATED_TS) / 60 ))
            if [ "$AGE_MIN" -lt 60 ]; then
              echo "⏭ PR #$PR_NUMBER trop récente (${AGE_MIN}min), skip"
              continue
            fi
            CHECK_COUNT=$(echo "$PR" | jq '[.statusCheckRollup[]? | select(((.name // .context // "") | test("vercel";"i") | not))] | length' 2>/dev/null || echo 0)
            FAILED_COUNT=$(echo "$PR" | jq '[.statusCheckRollup[]? | select(((.name // .context // "") | test("vercel";"i") | not) and .conclusion == "FAILURE")] | length' 2>/dev/null || echo 0)
            echo "--- PR #$PR_NUMBER ($HEAD_REF, ${AGE_MIN}min, $CHECK_COUNT checks, $FAILED_COUNT failed, issue #$ISSUE_NUMBER) ---"
            if [ "$CHECK_COUNT" -eq 0 ] && [ -n "$HEAD_REF" ]; then
              echo "⚠ PR #$PR_NUMBER orpheline (0 check, >60min) → redispatch CI"
              if gh workflow run ci.yml --ref "$HEAD_REF" -f pr_number="$PR_NUMBER" --repo "${{ github.repository }}" 2>&1 | head -5; then
                echo "✓ CI redispatchée pour #$PR_NUMBER"
                DISPATCHED=$((DISPATCHED+1))
              else
                echo "❌ redispatch CI échoué pour #$PR_NUMBER"
              fi
              sleep 2
              continue
            fi
            if [ "$FAILED_COUNT" -gt 0 ] && [ -n "$ISSUE_NUMBER" ]; then
              RETRY_COUNT=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name | select(startswith("ci-retry-"))] | length' 2>/dev/null || echo 0)
              HAS_HUMAN_LABEL=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name | select(. == "ci-needs-human")] | length' 2>/dev/null || echo 0)
              if [ "$RETRY_COUNT" -ge 3 ] || [ "$HAS_HUMAN_LABEL" -gt 0 ]; then
                echo "⛔ PR #$PR_NUMBER déjà à 3 retries ou label ci-needs-human, skip"
                continue
              fi
              echo "❌ PR #$PR_NUMBER CI rouge ($FAILED_COUNT failed), retry $RETRY_COUNT → redispatch dev-agent"
              gh issue edit "$ISSUE_NUMBER" --add-label "ci-retry-$((RETRY_COUNT+1))" 2>/dev/null || true
              if gh workflow run opencode.yml -f issue_number="$ISSUE_NUMBER" -f ci_failure=true --repo "${{ github.repository }}" 2>&1 | head -5; then
                echo "✓ Dev-agent redispatché pour #$ISSUE_NUMBER"
                DISPATCHED=$((DISPATCHED+1))
              else
                echo "❌ redispatch dev-agent échoué"
              fi
              sleep 2
              continue
            fi
            echo "✅ PR #$PR_NUMBER OK ou pas d'action"
          done
          echo "🏁 Watchdog terminé: $DISPATCHED dispatch(s) sur $COUNT PRs"

      - name: Reclaim stale `dispatched` claims
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Filet de sécurité du claim `dispatched` (opencode.yml le relâche sur échec,
          # mais GitHub n'exécute AUCUN step si le job est tué par timeout ou annulé —
          # cas le plus fréquent ici, timeout-minutes: 30). Sans ce filet, un claim
          # posé par un run mort verrouille l'issue POUR TOUJOURS : le scan générique la
          # saute, le watchdog la compte comme "déjà traitée", et seul un dispatch manuel
          # peut la libérer.
          #
          # On ne relâche que ce qui est prouvablement mort : claim posé il y a > 2h
          # (donc tous les runs de 30 min sont terminés) ET aucune PR ouverte ET aucun
          # workflow opencode en cours sur cette issue.
          echo "♻️ Reclaim des claims 'dispatched' périmés (>2h, sans PR, sans run actif)"
          STALE_HOURS=2
          NOW=$(date -u +%s)
          RECLAIMED=0
          MAX_RECLAIM=10

          gh issue list --label dispatched --state open --limit 100 \
            --json number,updatedAt > /tmp/claimed.json 2>/dev/null || echo "[]" > /tmp/claimed.json
          CLAIMED=$(jq 'length' /tmp/claimed.json 2>/dev/null || echo 0)
          echo "📋 $CLAIMED issues portent le claim 'dispatched'"

          # `seq 0 -1` it'dérerait sur des index invalides quand la liste est vide.
          if [ "$CLAIMED" -eq 0 ]; then
            echo "🏁 Reclaim: aucun claim à traiter"
            exit 0
          fi

          for i in $(seq 0 $((CLAIMED-1))); do
            [ "$RECLAIMED" -ge "$MAX_RECLAIM" ] && { echo "⏭ Max $MAX_RECLAIM reclaims atteint, arrêt"; break; }
            ISSUE_NUMBER=$(jq -r ".[$i].number" /tmp/claimed.json)
            UPDATED_AT=$(jq -r ".[$i].updatedAt // \"\"" /tmp/claimed.json)
            UPDATED_TS=$(date -d "$UPDATED_AT" +%s 2>/dev/null || echo "$NOW")
            AGE_MIN=$(( (NOW - UPDATED_TS) / 60 ))
            if [ "$AGE_MIN" -lt $((STALE_HOURS * 60)) ]; then
              continue
            fi
            # Une PR ouverte = travail réellement en vol → ne PAS relâcher.
            if gh pr list --state open --search "$ISSUE_NUMBER in:body" --json number --limit 1 --jq 'length' 2>/dev/null | grep -qv '^0$'; then
              echo "⏭ #$ISSUE_NUMBER (${AGE_MIN}min) a une PR ouverte — claim légitime, skip"
              continue
            fi
            # Un run opencode en cours sur cette issue = claim légitime, skip.
            if gh run list --workflow opencode.yml --status in_progress --limit 20 --json displayTitle \
                 --jq ".[].displayTitle" 2>/dev/null | grep -q "#$ISSUE_NUMBER"; then
              echo "⏭ #$ISSUE_NUMBER (${AGE_MIN}min) a un run opencode en cours — skip"
              continue
            fi
            echo "♻️ #$ISSUE_NUMBER (${AGE_MIN}min, aucune PR, aucun run) → claim relâché"
            gh issue edit "$ISSUE_NUMBER" --remove-label dispatched 2>/dev/null || true
            RECLAIMED=$((RECLAIMED+1))
            sleep 1
          done
          echo "🏁 Reclaim: $RECLAIMED claim(s) relâché(s) sur $CLAIMED"
