name: QA Tester

on:
  schedule:
    # Daily QA run: 6h, 12h, 18h UTC
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:

jobs:
  run-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run QA Tests
        id: qa-tests
        continue-on-error: true
        run: node qa/qa-bot.mjs
        env:
          QA_BASE_URL: https://bitbrawler.pages.dev
          QA_HEADLESS: 'true'

      - name: Commit QA stats
        if: always()
        run: |
          git config user.name "opencode-agent"
          git config user.email "agent@opencode.ai"
          git add qa/stats.json qa/state.json
          # Skip flags are mandatory here: this job runs hourly and pushes to
          # master, so every stats commit would otherwise trigger a full
          # production build.
          #   [skip ci]      -> convention GitHub Actions
          #   [CF-Pages-Skip] -> explicit Cloudflare Pages marker
          # Cloudflare Pages skips a deployment when either appears anywhere in
          # the commit message (case-insensitive, documented in the GitHub
          # integration docs). Both are listed so the flag survives a change of
          # hosting without having to be rediscovered the hard way.
          git diff --cached --quiet || git commit -m "chore: update QA stats [skip ci] [CF-Pages-Skip]"
          git pull --rebase
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
