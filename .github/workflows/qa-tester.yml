name: QA Tester

on:
  schedule:
    # Daily QA run: 6h, 12h, 18h UTC
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:

concurrency:
  # Issue #1132 : 3 runs QA par jour + les déclenchements manuels poussent tous
  # qa/stats.json sur master. Sans sérialisation, deux runs se marchent dessus.
  #
  # L'annulation en cours de route doit rester DÉSACTIVÉE — un run QA ne doit
  # jamais être annulé : il vient de jouer une vraie partie contre la prod, et
  # l'interrompre perdrait ses stats. Les runs en attente sont donc rejoués à la
  # suite, pas jetés.
  group: qa-stats-commit
  cancel-in-progress: false

jobs:
  run-qa:
    # Épinglé, pas `ubuntu-latest`. Le 2026-10-22 `latest` a basculé sur Ubuntu
    # 26.04, que Playwright 1.60 (celui du package) ne connaît pas encore :
    #   Error: ERROR: Playwright does not support chromium on ubuntu26.04-x64
    # Le job mourait à l'installation du navigateur, avant le premier combat —
    # neuf runs QA rouges d'affilée, plus une seule stat pour le tech-lead.
    # C'est Playwright qui doit monter de version pour suivre un nouvel OS ;
    # en attendant, la QA reste sur l'image LTS 24.04 qui est supportée.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: |
          # La version est loguée : « Playwright does not support chromium on
          # ubuntuXX.YY-x64 » ne se diagnostique qu'en connaissant les deux
          # côtés du couple (version du paquet × image du runner).
          npx playwright --version
          npx playwright install chromium --with-deps

      - name: Run QA Tests
        id: qa-tests
        continue-on-error: true
        run: node qa/qa-bot.mjs
        env:
          QA_BASE_URL: https://bitbrawler.pages.dev
          QA_HEADLESS: 'true'

      # Les captures que le bot prend sur chaque échec (no-start, pve-locked,
      # timeout, skip…) vivaient et mouraient sur le runner. Résultat : on
      # voyait « 0 combat » dans les stats sans jamais pouvoir dire POURQUOI —
      # impossible de distinguer un CTA ignoré d'un écran de résultat manqué.
      # On les garde 7 jours : chaque échec QA devient diagnosticable.
      - name: Upload QA screenshots (failure evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: qa/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit QA stats
        if: always()
        run: |
          git config user.name "opencode-agent"
          git config user.email "agent@opencode.ai"
          git add qa/stats.json qa/state.json
          # Skip flags are mandatory here: this job runs hourly and pushes to
          # master, so every stats commit would otherwise trigger a full
          # production build.
          #   [skip ci]      -> convention GitHub Actions
          #   [CF-Pages-Skip] -> explicit Cloudflare Pages marker
          # Cloudflare Pages skips a deployment when either appears anywhere in
          # the commit message (case-insensitive, documented in the GitHub
          # integration docs). Both are listed so the flag survives a change of
          # hosting without having to be rediscovered the hard way.
          git diff --cached --quiet || git commit -m "chore: update QA stats [skip ci] [CF-Pages-Skip]"

          # Issue #1132 — pourquoi une reprise en boucle ici.
          #
          # Le `concurrency` en tête de fichier sérialise les runs QA ENTRE EUX,
          # mais master bouge aussi pour d'autres raisons : merges de PR par le
          # reviewer, commits des autres bots. Or qa/stats.json est réécrit EN
          # ENTIER à chaque run, donc toute écriture concurrente produit un conflit
          # de rebase — l'ancien `git pull --rebase` sec laissait alors l'étape en
          # échec et les stats du run étaient perdues.
          #
          # `-X theirs` pendant le rebase garde la version du commit rejoué, donc
          # les stats fraîches de CE run — seules dans le commit — et ne peut rien
          # écraser d'autre : le commit ne porte que qa/stats.json et qa/state.json.
          for tentative in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs \
              && git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}; then
              echo "✅ QA stats poussées (tentative $tentative)"
              exit 0
            fi
            echo "⚠ tentative $tentative échouée — nouvel essai dans $((tentative * 10))s"
            sleep $((tentative * 10))
          done

          # Échec sonore plutôt que silencieux : des stats perdues sans trace sont
          # indiscernables d'un run qui n'aurait rien produit.
          echo "::error::qa/stats.json non poussé après 3 tentatives — les stats de ce run sont perdues"
          exit 1
